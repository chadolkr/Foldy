<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Foldy app icon master (retro Windows style). Palette: outline #4A2000, back #D66800, front #FF961C, light #FFC86E, letter #2A1200, paper #FFF8E7 -->
  <!-- hard retro drop shadow -->
  <path d="M20 46 H104 L116 62 H244 V244 H20 Z" fill="#000" opacity="0.28"/>
  <!-- back panel with tab -->
  <path d="M10 36 H96 L108 52 H234 V232 H10 Z" fill="#D66800" stroke="#4A2000" stroke-width="8" stroke-linejoin="miter"/>
  <path d="M18 44 H92 L100 56" fill="none" stroke="#FFA94A" stroke-width="6"/>
  <!-- paper sheet -->
  <rect x="34" y="64" width="176" height="40" fill="#FFF8E7" stroke="#4A2000" stroke-width="6"/>
  <path d="M50 78 H190 M50 90 H160" stroke="#C9B89A" stroke-width="5"/>
  <!-- front panel -->
  <rect x="10" y="92" width="224" height="140" fill="#FF961C" stroke="#4A2000" stroke-width="8"/>
  <rect x="14" y="96" width="216" height="12" fill="#FFC86E"/>
  <rect x="14" y="214" width="216" height="14" fill="#D66800"/>
  <!-- bold F: light emboss offset, then letter -->
  <path d="M84 116 H178 V146 H120 V160 H166 V188 H120 V212 H84 Z" fill="#FFD9A0" transform="translate(5 5)"/>
  <path d="M84 116 H178 V146 H120 V160 H166 V188 H120 V212 H84 Z" fill="#2A1200"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
