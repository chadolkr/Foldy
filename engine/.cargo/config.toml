# Rust 프로그램(foldy-index.exe, foldy-update.exe, foldy_copy.dll)에 C 런타임을 넣어서 만든다.
# 넣지 않으면 VCRUNTIME140.dll(Visual C++ 재배포 패키지)이 없는 새 PC에서 색인 서비스가 시작하지 못해
# MSI 설치가 통째로 되돌려지고(1.3.0, winget 검증에서 발견), 복사 엔진도 불러오지 못한다.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
