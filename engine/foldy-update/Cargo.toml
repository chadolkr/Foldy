[package]
name = "foldy-update"
description = "Foldy 자동 업데이트 - GitHub Releases 확인·다운로드·Ed25519 검증·설치 (설계서 10.5)"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "foldy_update"
path = "src/lib.rs"

[[bin]]
name = "foldy-update"
path = "src/bin/foldy-update.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# 서명: BSD-3-Clause, 해시: MIT/Apache-2.0, 난수: MIT/Apache-2.0 → 모두 GPL-3.0 호환
ed25519-dalek = "2"
sha2 = "0.11"
getrandom = "0.2"

# HTTP는 WinHTTP: Windows 시스템 프록시(PAC/WPAD)와 사용자 기본 자격 증명(NTLM/Negotiate),
# TLS는 SChannel을 그대로 쓴다 (OpenSSL 없음). MIT/Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[lints]
workspace = true
