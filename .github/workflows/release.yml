name: Release

# v1.2.3 형식 태그를 푸시하면 빌드 → 테스트 → 포터블 zip → update.json 서명 → GitHub Release (설계서 10.5).
# 서명 비밀키 FOLDY_UPDATE_SIGNING_KEY는 Environment `release`(태그 v*.*.*만) 시크릿으로 둔다 (docs/release-signing.md, 보안 리뷰 V3).
# auto-release.yml이 main의 CI 통과 뒤 태그를 만들고 이 워크플로를 태그 위에서 직접 실행한다(workflow_dispatch).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# SignPath 코드 서명 (docs/code-signing.md). 저장소 변수 SIGNPATH_ORGANIZATION_ID와
# 시크릿 SIGNPATH_API_TOKEN이 둘 다 있을 때만 서명한다. 없으면 서명 단계는 건너뛰고 지금처럼 릴리스한다.
env:
  SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_API_TOKEN != '' }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Foldy' }}
  SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
  VT_ENABLED: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # 서명 키를 Environment `release`의 시크릿으로 옮기면(보안 리뷰 V3) 이 작업만 읽는다.
    # 아직 옮기기 전이면 저장소 시크릿을 그대로 읽으므로 지금도 안전하게 돈다.
    environment: release
    timeout-minutes: 150   # 서명 승인 대기(최대 1시간 × 2) 포함
    permissions:
      contents: write      # GitHub Release 만들기
      actions: write       # SignPath 아티팩트 읽기 + 릴리스 뒤 소개 사이트(pages.yml) 다시 만들기
      id-token: write      # 빌드 출처 증명(attestation) 서명
      attestations: write  # 빌드 출처 증명 저장
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$') { throw "태그 형식이 v1.2.3이 아님: $tag" }
          $v = $tag.Substring(1)
          $pre = if ($v.Contains('-')) { 'true' } else { 'false' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          "channel=$(if ($pre -eq 'true') { 'beta' } else { 'stable' })" >> $env:GITHUB_OUTPUT

      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - name: Setup zip (self-contained x64, 한 번에 설치)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          ./build/setup/make-setup.ps1 -SkipRust -Version $v -ZipDir artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'setup 실패' }

      # ── 코드 서명 1: payload의 exe·dll (MSI와 zip이 서명된 파일을 담도록 MSI보다 먼저) ──
      - name: Upload payload for signing
        id: up-payload
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payload-unsigned
          path: dist/Foldy-Setup/payload
          if-no-files-found: error

      - name: SignPath sign payload
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: payload
          github-artifact-id: ${{ steps.up-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # 릴리스마다 승인자가 SignPath에서 직접 승인
          output-artifact-directory: dist/payload-signed

      - name: Replace payload with signed files and rebuild setup zip
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $payload = 'dist/Foldy-Setup/payload'
          Copy-Item dist/payload-signed/* $payload -Recurse -Force
          foreach ($f in 'Foldy.exe', 'foldy-index.exe', 'foldy-update.exe') {
            $sig = Get-AuthenticodeSignature (Join-Path $payload $f)
            if ($sig.Status -ne 'Valid') { throw "$f 서명 상태: $($sig.Status)" }
          }
          $zip = Get-ChildItem artifacts/release -Filter '*-setup.zip' | Select-Object -First 1
          Remove-Item $zip.FullName
          Compress-Archive -Path dist/Foldy-Setup/* -DestinationPath $zip.FullName

      # WiX 6 MSI (Foldy-<v>-x64.msi): 위 단계가 만든 페이로드를 재사용한다 (docs/installer.md).
      # WiX 7은 OSMF EULA 동의가 필요하므로 6.x로 고정한다.
      - name: MSI (WiX 6)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.UI.wixext/6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2
          ./build/installer/build-msi.ps1 -SkipPayload -Version $v -OutDir artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'MSI 빌드 실패' }

      # Store 판(MSIX): 같은 payload를 감싼다. 서명은 Store가 하므로 여기서는 하지 않고, Release가 아닌 워크플로 아티팩트로만 올린다.
      # Identity는 저장소 변수(Partner Center → Product identity). 없으면 시험용 값으로 만든다 (docs/store.md).
      - name: Store MSIX
        continue-on-error: true   # 첫 실제 빌드로 검증될 때까지 릴리스를 막지 않는다
        shell: pwsh
        env:
          FOLDY_STORE_IDENTITY_NAME: ${{ vars.FOLDY_STORE_IDENTITY_NAME }}
          FOLDY_STORE_PUBLISHER: ${{ vars.FOLDY_STORE_PUBLISHER }}
          FOLDY_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.FOLDY_STORE_PUBLISHER_DISPLAY_NAME }}
          FOLDY_STORE_SERVICE: ${{ vars.FOLDY_STORE_SERVICE }}   # false면 색인 서비스를 빼고 만든다 (Store 심사에서 거절될 때)
        run: |
          ./build/store/make-msix.ps1 -Version '${{ steps.ver.outputs.version }}' -OutDir artifacts/store

      - name: Upload Store MSIX
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foldy-store-msix
          path: artifacts/store/*.msix
          if-no-files-found: error

      # ── 코드 서명 2: MSI ──
      - name: Upload MSI for signing
        id: up-msi
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msi-unsigned
          path: artifacts/release/*.msi
          if-no-files-found: error

      - name: SignPath sign MSI
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.up-msi.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/msi-signed

      - name: Replace MSI with signed file
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          Copy-Item dist/msi-signed/*.msi artifacts/release -Force
          Get-ChildItem artifacts/release -Filter *.msi | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { throw "$($_.Name) 서명 상태: $($sig.Status)" }
          }

      # update.json의 해시는 서명이 끝난 최종 파일로 계산한다.
      - name: update.json + Ed25519 signature
        shell: pwsh
        env:
          FOLDY_UPDATE_SIGNING_KEY: ${{ secrets.FOLDY_UPDATE_SIGNING_KEY }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $out = 'artifacts/release'
          if (-not $env:FOLDY_UPDATE_SIGNING_KEY) { throw '시크릿 FOLDY_UPDATE_SIGNING_KEY가 없습니다 (docs/release-signing.md)' }
          $tool = 'engine/target/release/foldy-update.exe'
          $assets = Get-ChildItem $out -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.msi' } | ForEach-Object FullName
          & $tool manifest --version $v --channel '${{ steps.ver.outputs.channel }}' --out "$out/update.json" @assets
          if ($LASTEXITCODE -ne 0) { throw 'manifest 실패' }
          & $tool sign "$out/update.json"
          if ($LASTEXITCODE -ne 0) { throw 'sign 실패' }
          # 앱에 내장된 공개키로 다시 검사: 시크릿과 커밋된 공개키가 짝이 아니면 여기서 멈춘다
          & $tool verify "$out/update.json"
          if ($LASTEXITCODE -ne 0) { throw '내장 공개키로 검증 실패 — keys/update-signing.pub과 시크릿이 짝인지 확인' }
          Get-Content "$out/update.json"

      # ── 안전 근거 (docs/security-evidence.md) ──
      # SBOM: 이 릴리스에 들어간 라이브러리 목록 (.NET 페이로드의 deps.json·dll + Rust Cargo.lock)
      - name: Stage SBOM inputs
        shell: pwsh
        run: |
          $d = 'artifacts/sbom-input'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item dist/Foldy-Setup/payload "$d/payload" -Recurse
          Copy-Item engine/Cargo.toml, engine/Cargo.lock $d

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: artifacts/sbom-input
          format: spdx-json
          output-file: artifacts/release/Foldy-${{ steps.ver.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # SHA256SUMS.txt: 내려받은 파일이 이 빌드와 같은지 누구나 Get-FileHash로 비교할 수 있게
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $out = 'artifacts/release'
          $files = Get-ChildItem $out -File | Where-Object { $_.Extension -ne '.wixpdb' -and $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          $lines = foreach ($f in $files) { '{0}  {1}' -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $f.Name }
          [IO.File]::WriteAllLines((Join-Path $out 'SHA256SUMS.txt'), [string[]]$lines)
          Get-Content (Join-Path $out 'SHA256SUMS.txt')

      # GitHub artifact attestation: "이 파일은 chadolkr/Foldy 저장소의 이 커밋을 GitHub 서버가 공개 워크플로로 빌드했다"는
      # 서명된 증명. 누구나 `gh attestation verify <파일> --repo chadolkr/Foldy`로 확인한다.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/release/*.msi
            artifacts/release/*.zip
            artifacts/release/update.json*
            artifacts/release/*.spdx.json
            artifacts/release/SHA256SUMS.txt

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            artifacts/release/*.msi
            artifacts/release/*.zip
          sbom-path: artifacts/release/Foldy-${{ steps.ver.outputs.version }}.spdx.json

      # VirusTotal: 70여 개 백신으로 설치 파일을 검사하고 결과 링크를 릴리스 노트에 남긴다.
      # 저장소 시크릿 VIRUSTOTAL_API_KEY(무료 계정 키)가 있을 때만. 없으면 건너뛴다 (docs/security-evidence.md).
      - name: VirusTotal scan
        id: vt
        if: env.VT_ENABLED == 'true'
        continue-on-error: true   # VirusTotal이 느리거나 한도에 걸려도 릴리스는 막지 않는다
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          request_rate: 4
          files: |
            artifacts/release/*.msi
            artifacts/release/*.zip

      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VT_RAN: ${{ steps.vt.outcome == 'success' }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = Get-ChildItem artifacts/release -File | Where-Object Extension -ne '.wixpdb' | ForEach-Object FullName
          $repo = '${{ github.repository }}'
          $run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          $notes = [System.Collections.Generic.List[string]]::new()
          $notes.Add('### 이 파일이 진짜인지 확인하기 / Verify this download')
          $notes.Add('')
          $notes.Add('- 공식 주소는 https://github.com/chadolkr/Foldy 와 https://chadolkr.github.io/Foldy 뿐입니다. / The only official sources are https://github.com/chadolkr/Foldy and https://chadolkr.github.io/Foldy.')
          $notes.Add("- 이 릴리스는 사람 손을 거치지 않고 공개 GitHub Actions에서 빌드됐습니다 / Built by public GitHub Actions, untouched by hand: $run")
          $notes.Add("- 빌드 출처 증명 / Build provenance: ``gh attestation verify <file> --repo $repo`` · https://github.com/$repo/attestations")
          $notes.Add('- SHA-256: `SHA256SUMS.txt`, SBOM: `*.spdx.json`')
          if ($env:VT_RAN -eq 'true') {
            $notes.Add('- VirusTotal:')
            Get-ChildItem artifacts/release -File | Where-Object { $_.Extension -in '.msi', '.zip' } | ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $notes.Add("  - $($_.Name): https://www.virustotal.com/gui/file/$h")
            }
          }
          $notes.Add('- 자세히 / Details: https://github.com/chadolkr/Foldy/blob/main/SECURITY.md')
          $notes.Add('')
          # SignPath Foundation 요건: 릴리스 페이지에 Code signing policy 링크
          # 릴리스 페이지도 검색에 잡히므로 맨 위에 무엇인지 한 줄씩 (영어·한국어), 그다음 진짜 확인 방법
          $intro = @(
            '**Foldy** is a free, open-source dual-pane file manager for Windows 10/11: instant Ctrl+Space search, disk space analyzer, step-by-step Desktop and Downloads cleanup. Works offline.',
            '빠르고 똑똑한 Windows 파일 관리자, 오프라인에서도. 무료 오픈소스.',
            '',
            'Website: https://chadolkr.github.io/Foldy/ · Install: download `Foldy-*-x64.msi` below and double-click it. Not code-signed yet, so SmartScreen may ask you to click More info → Run anyway.',
            ''
          )
          $notes.Add('Code signing policy: https://github.com/chadolkr/Foldy#code-signing-policy')
          @($intro) + @($notes) | Set-Content release-notes-header.md -Encoding utf8
          $flags = @('--generate-notes', '--notes-file', 'release-notes-header.md', '--title', "Foldy $tag", '--verify-tag')
          if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $tag @files @flags
          if ($LASTEXITCODE -ne 0) { throw 'release 생성 실패' }
          # 버전 없는 이름의 같은 MSI: 소개 페이지가 늘 releases/latest/download/Foldy-Setup.msi 로 최신을 받게 (사용자 2026-11-25).
          # 내용이 같아 해시·출처 증명은 버전 붙은 파일과 같다. update.json·SHA256SUMS에는 넣지 않고,
          # 이름이 -x64.msi로 끝나지 않아 업데이트 도구가 고르는 파일과 섞이지 않는다.
          $msi = Get-ChildItem artifacts/release -Filter 'Foldy-*-x64.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI가 없음' }
          New-Item -ItemType Directory -Force latest-alias | Out-Null
          Copy-Item $msi.FullName latest-alias/Foldy-Setup.msi
          gh release upload $tag latest-alias/Foldy-Setup.msi
          if ($LASTEXITCODE -ne 0) { throw 'Foldy-Setup.msi 올리기 실패' }
          # "나만 설치"(관리자 권한 없이, 1.19.0)도 늘 같은 주소로: releases/latest/download/Foldy-Setup-user.msi
          $userMsi = Get-ChildItem artifacts/release -Filter 'Foldy-*-x64-user.msi' | Select-Object -First 1
          if (-not $userMsi) { throw '나만 설치 MSI가 없음' }
          Copy-Item $userMsi.FullName latest-alias/Foldy-Setup-user.msi
          gh release upload $tag latest-alias/Foldy-Setup-user.msi
          if ($LASTEXITCODE -ne 0) { throw 'Foldy-Setup-user.msi 올리기 실패' }

      # 소개 사이트에 새 버전 반영. 이 작업의 GITHUB_TOKEN으로 만든 릴리스는 pages.yml의 'release: published'를
      # 깨우지 못해서(GitHub 규칙) 여기서 직접 다시 만든다. 실패해도 릴리스는 그대로 둔다.
      - name: Rebuild product site
        if: steps.ver.outputs.prerelease != 'true'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      # Microsoft Store에도 이어서 제출 (사용자 2026-11-25 "바로 배포되도록"). Store 인증은 Microsoft가 하고
      # 통과하면 바로 공개된다. 저장소 변수 STORE_AUTO_SUBMIT을 false로 두면 하지 않는다. 실패해도 릴리스는 그대로 둔다.
      # "새로운 기능" 글은 docs/store-listing/*.md를 쓰므로, 버전 PR에서 함께 고쳐 둔다.
      - name: Submit to Microsoft Store
        if: steps.ver.outputs.prerelease != 'true' && vars.STORE_AUTO_SUBMIT != 'false'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run store.yml --ref main -f tag='${{ github.ref_name }}' -f mode=submit
