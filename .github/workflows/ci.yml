name: CI

# 홈페이지(site/)나 README만 바뀌면 앱은 그대로이므로 건너뛴다. 홈페이지는 site-check.yml이 본다.
# 다른 파일이 하나라도 섞이면 전체를 돌린다 (paths-ignore의 뜻).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    # C#과 Rust를 함께 빌드·테스트한다 (설계서 10.2). 로컬과 같은 build.ps1을 호출.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}

      # Store 설명 글(docs/store-listing)의 모양과 글자 수 제한. 제출 때 막히지 않게 미리 본다 (네트워크 없음)
      - name: Store listing text
        shell: pwsh
        run: ./build/store/submit.ps1 -Mode text-draft -CheckOnly

      # Store 판(MSIX) 매니페스트: 릴리스 때만 만들어서 틀려도 늦게 안다. 가짜 exe로 makeappx 검사만 (1.15.0)
      - name: Store package manifest
        shell: pwsh
        run: ./build/store/check-msix.ps1

      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      # Store 판(MSIX)을 실제로 설치해 색인 서비스가 패키지 서비스로 뜨고 찾기 통로가 열리는지 (1.15.0)
      - name: Store package installs the search service
        shell: pwsh
        timeout-minutes: 15
        run: ./build/store/test-msix-service.ps1

      # Rust 프로그램이 Visual C++ 재배포 패키지 없이 도는지 (engine/.cargo/config.toml의 crt-static).
      # 런타임 DLL을 찾으면 그런 PC에서 색인 서비스가 시작하지 못해 MSI 설치가 되돌려진다 (1.3.0, winget 검증).
      - name: Rust binaries need no VC++ runtime
        shell: pwsh
        run: |
          foreach ($f in 'foldy-index.exe', 'foldy-update.exe', 'foldy-hotkey.exe', 'foldy_copy.dll') {
            $p = "engine/target/release/$f"
            if (-not (Test-Path $p)) { throw "$p 없음" }
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($p))
            if ($text -match '(?i)vcruntime140(_1)?\.dll|msvcp140\.dll') { throw "$f 가 $($Matches[0])을 찾습니다" }
            Write-Host "$f OK"
          }

      # 화면 자동 점검: 모든 장면(메인, 대화 창, 메모, 작은 화면 1366x768, 큰 글씨 130%, 다크 테마, 설정, 위저드 …)을
      # 실제로 띄워 찍어 본다. 창이 하나라도 열리지 않거나 예외가 나면 실패한다. 찍은 그림은 아티팩트로 남긴다.
      - name: UI smoke (all scenes)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'ui-shots'
          ./build/doc-screenshots.ps1 -Out $out -Strict
          $n = (Get-ChildItem $out -Filter *.png).Count
          Write-Host "장면 $n개"
          if ($n -lt 25) { throw "장면이 너무 적음: $n" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-shots
          path: ${{ runner.temp }}/ui-shots/*.png
          retention-days: 7

      - name: Check generated bindings are committed
        shell: pwsh
        run: |
          git diff --exit-code -- src/Foldy.Copy.Native/NativeMethods.g.cs engine/foldy-proto/tests/golden
