name: Rerun CodeQL once

# CodeQL은 분석이 끝난 뒤 결과를 GitHub에 올리는 단계에서 가끔 GitHub 쪽 사정으로 실패한다
# (2026-11-25 PR 104: 세 언어가 오류 줄 없이 "올리기"에서 실패, 같은 커밋을 다시 돌리니 통과).
# 그럴 때 사람이 다시 누르지 않아도 되게, 실패한 작업만 딱 한 번 다시 돌린다.
# 두 번째도 실패하면 진짜 문제로 보고 그대로 둔다 (사용자 2026-11-26 "에러 발생하면 자동 조치").
# 코드를 받아 오지 않고 GitHub API만 부르므로, 포크 PR이 만든 실행이어도 그 코드가 여기서 돌지 않는다.
on:
  workflow_run:
    workflows: [CodeQL]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write   # 실패한 작업 다시 돌리기만
    steps:
      - name: Rerun failed CodeQL jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
