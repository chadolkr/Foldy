# 의존성의 보안 업데이트를 자동으로 PR로 올린다. 사람이 CI 결과를 보고 병합한다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      nuget-minor: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /engine
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      cargo-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: monthly }
    groups:
      site: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /tools/crash-relay
    schedule: { interval: monthly }
    groups:
      crash-relay: { patterns: ['*'] }
